services:
  - type: web
    name: land-document-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: land-document-frontend
    env: docker
    region: oregon
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: REACT_APP_API_URL
        value: https://land-document-backend.onrender.com
      - key: PORT
        value: 80
